# What the session reads from OpenBao, through the cluster's External Secrets:
# - the PCs' accounts.toml (`secret/home/tuimail`, `accounts`), so it serves the same accounts;
# - its store's key (`secret/services/tuimail`, `key`: 64 hex digits), whose recovery copy is
#   Key Vault romaine-kv's `tuimail-session-key`. Without it the store, and its backup, can't
#   be read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: session
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: session
  data:
    - secretKey: accounts.toml
      remoteRef:
        key: home/tuimail
        property: accounts
    - secretKey: key
      remoteRef:
        key: services/tuimail
        property: key
---
# The account External Secrets signs in to OpenBao as for this namespace's pull secret: the
# only one OpenBao's Kubernetes role forgejo-image-pull takes, which may only get the registry
# token (nelsong6/openbao; nelsong6/home-cluster's ClusterGenerator forgejo-image-pull).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-image-pull
---
# Pulls of our images from Forgejo's registry, with no stored token (BAO-15): an hour's token
# OpenBao signs, which Forgejo takes as nelson's integration cluster-image-pull (read:package),
# made by the ClusterGenerator forgejo-image-pull and refreshed every 10 minutes, so a pull
# never meets an expired one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry
spec:
  refreshInterval: 10m
  target:
    name: forgejo-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forgejo.romaine.life":{"username":"nelson","password":"{{ .token }}"}}}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: forgejo-image-pull
