[package]
name = "tuimail"
version = "0.2.5"
edition = "2024"
description = "Email in your terminal: a vim-style IMAP, POP3 and SMTP client"
license = "MIT"
repository = "https://forgejo.romaine.life/romaine-life/tuimail"
readme = "README.md"
rust-version = "1.90"
keywords = ["email", "imap", "tui", "terminal", "vim"]
categories = ["command-line-utilities", "email"]
include = ["src/**/*.rs", "themes/*.toml", "README.md", "LICENSE", "SECURITY.md", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "tuimail"
path = "src/main.rs"

# Release asset URLs for installers that supply Forgejo authentication.
# README.md has authenticated download commands. QuickInstall binaries,
# which are not built here, are never used.
# Each is the bare binary, named for its platform.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tuimail-linux-amd64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tuimail-linux-arm64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tuimail-windows-amd64.exe"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tuimail-windows-arm64.exe"

# The Linux releases run on glibc 2.35 (Ubuntu 22.04) and newer.
[package.metadata.pipeline-templates.targets.x86_64-unknown-linux-gnu]
glibc = "2.35"

[package.metadata.pipeline-templates.targets.aarch64-unknown-linux-gnu]
glibc = "2.35"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
html2text = "0.17"
keyring-core = "1.0"
libloading = "0.9"
logline = { git = "https://forgejo.romaine.life/romaine-life/logline", tag = "v0.1.0" }
mail-builder = { version = "1.0", default-features = false }
mail-parser = "0.11"
one-copy = { git = "https://forgejo.romaine.life/romaine-life/one-copy", tag = "v0.1.0" }
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
ring = "0.17.14"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.6"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The session (`tuimail session`) runs on Linux and keeps its sign-ins (and, later, the archive)
# in an encrypted SQLite file: SQLCipher, built with its own OpenSSL so the build needs no
# system one. Windows builds keep plain SQLite for the PC's cache.
[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }
